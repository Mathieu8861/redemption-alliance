<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redemption - Jeu de Cartes</title>
    <link rel="icon" type="image/png" href="assets/images/logo-damocles.png?v=20260916">
    <meta name="description" content="Site de l'alliance Redemption [RDM] : combats PvP, percepteurs, recyclages, forgemagie. L'heure de la rédemption.">
    <meta name="theme-color" content="#e07c0a">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Redemption">
    <meta property="og:title" content="Redemption [RDM] - Alliance PvP Dofus">
    <meta property="og:description" content="L'heure de la rédemption. Combats, percepteurs, recyclages, forgemagie : le QG de l'alliance Redemption.">
    <meta property="og:url" content="https://redemption-alliance.vercel.app/">
    <meta property="og:image" content="https://redemption-alliance.vercel.app/assets/images/og-damocles.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://redemption-alliance.vercel.app/assets/images/og-damocles.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=20260916">
</head>
<body>

    <header class="header">
        <div class="header__inner">
            <div class="header__brand">
                <img class="header__logo" src="assets/images/logo-damocles.png?v=20260916" alt="Logo Redemption">
                
            </div>

            <div class="header__user">
                <a href="admin.html" class="header__icon" id="nav-admin-link" title="Admin" style="display:none;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15v2m-6 4h12a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2zm10-10V7a4 4 0 0 0-8 0v4h8z"/></svg>
                </a>
                <span class="header__username" id="nav-username"></span>
                <button class="header__icon" id="btn-logout" title="Deconnexion">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                </button>
                <button class="nav__toggle" id="nav-toggle">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </div>
    </header>

    <aside id="app-sidebar" class="app-sidebar" aria-label="Navigation principale"></aside>

    <main class="main main--jeux">
        <div class="mb-lg">
            <h1 style="font-family: var(--font-title); font-size: 1.5rem; font-weight: 700; margin-bottom: var(--spacing-xs);">Jeu de Cartes du Dieu Ecaflip</h1>
            <p class="text-muted" style="font-size: 0.8125rem;">Tentez votre chance avec vos jetons</p>
        </div>

        <div class="game-layout game-layout--jeux">

            <!-- Gauche : Jeu de Cartes (centré, plus gros) -->
            <div class="game-section game-section--game">
                <div class="game-section__title">Tenter sa chance</div>

                <!-- Solde + prix -->
                <div class="game-info--prominent">
                    <span class="game-info__solde">Vos jetons : <span class="jetons-count" id="jetons-count">0</span></span>
                    <span class="game-info__prix">Cout : <strong id="prix-tirage">12</strong> jetons</span>
                </div>

                <!-- 3 cartes -->
                <div class="game-cards" id="game-cards">
                    <div class="game-card" data-index="0">
                        <div class="game-card__inner">
                            <div class="game-card__front">
                                <img class="game-card__logo" src="assets/images/logo-damocles.png?v=20260916" alt="RDM">
                            </div>
                            <div class="game-card__back">
                                <span class="lot-name">?</span>
                            </div>
                        </div>
                    </div>
                    <div class="game-card" data-index="1">
                        <div class="game-card__inner">
                            <div class="game-card__front">
                                <img class="game-card__logo" src="assets/images/logo-damocles.png?v=20260916" alt="RDM">
                            </div>
                            <div class="game-card__back">
                                <span class="lot-name">?</span>
                            </div>
                        </div>
                    </div>
                    <div class="game-card" data-index="2">
                        <div class="game-card__inner">
                            <div class="game-card__front">
                                <img class="game-card__logo" src="assets/images/logo-damocles.png?v=20260916" alt="RDM">
                            </div>
                            <div class="game-card__back">
                                <span class="lot-name">?</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Instruction -->
                <p class="game-instruction text-muted text-center" id="game-instruction" style="font-size:0.875rem;margin-bottom:var(--spacing-md);">Cliquez sur "Tenter sa chance" pour mélanger les cartes</p>

                <!-- Bouton CTA -->
                <div class="text-center">
                    <button class="btn btn--primary btn--cta" id="btn-tirer">TENTER SA CHANCE</button>
                </div>
            </div>

            <!-- Droite : Classement Jetons -->
            <div class="game-section game-section--ranking">
                <div class="game-section__title">Classement Jetons</div>
                <div id="jetons-ranking">
                    <div class="loading"><div class="spinner"></div> Chargement...</div>
                </div>
            </div>
        </div>

        <!-- Modal resultat -->
        <div class="modal-overlay" id="modal-result">
            <div class="modal modal--result">
                <img class="result-ecaflip" src="assets/images/dieu_ecaflip.png" alt="">
                <div class="modal__header">
                    <h2 class="modal__title" id="result-title">Résultat</h2>
                    <button class="modal__close" id="result-close">&times;</button>
                </div>
                <div class="modal__body" id="result-body"></div>
            </div>
        </div>

        <!-- Confetti container -->
        <div class="confetti-container" id="confetti-container"></div>
    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js?v=20260916"></script>
    <script src="js/jeux.js?v=20260916"></script>
</body>
</html>
