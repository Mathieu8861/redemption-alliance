<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redemption - Jeux</title>
    <link rel="icon" type="image/png" href="assets/images/logo-damocles.png?v=20260918">
    <meta name="description" content="Site de l'alliance Redemption [RDM] : combats PvP, percepteurs, recyclages, forgemagie. L'heure de la rédemption.">
    <meta name="theme-color" content="#e07c0a">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Redemption">
    <meta property="og:title" content="Redemption [RDM] - Alliance PvP Dofus">
    <meta property="og:description" content="L'heure de la rédemption. Combats, percepteurs, recyclages, forgemagie : le QG de l'alliance Redemption.">
    <meta property="og:url" content="https://redemption-alliance.vercel.app/">
    <meta property="og:image" content="https://redemption-alliance.vercel.app/assets/images/og-damocles.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://redemption-alliance.vercel.app/assets/images/og-damocles.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=20260918">
</head>
<body>

    <header class="header">
        <div class="header__inner">
            <div class="header__brand">
                <img class="header__logo" src="assets/images/logo-damocles.png?v=20260918" alt="Logo Redemption">
                
            </div>

            <div class="header__user">
                <a href="admin.html" class="header__icon" id="nav-admin-link" title="Admin" style="display:none;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15v2m-6 4h12a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2zm10-10V7a4 4 0 0 0-8 0v4h8z"/></svg>
                </a>
                <span class="header__username" id="nav-username"></span>
                <button class="header__icon" id="btn-logout" title="Deconnexion">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                </button>
                <button class="nav__toggle" id="nav-toggle">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </div>
    </header>

    <aside id="app-sidebar" class="app-sidebar" aria-label="Navigation principale"></aside>

    <main class="main main--jeux-hub">

        <div class="jeux-hub">
            <!-- Jeu de Cartes - Ecaflip -->
            <a href="cartes.html" class="jeux-hub__card">
                <div class="jeux-hub__card-image">
                    <img src="assets/images/capture_ecran_ecaflipus.jpg" alt="Jeu de Cartes">
                </div>
                <div class="jeux-hub__card-body">
                    <h2 class="jeux-hub__card-title">Jeu de Cartes</h2>
                    <p class="jeux-hub__card-god">Dieu Ecaflip</p>
                    <p class="jeux-hub__card-desc">Melangez les cartes et choisissez la bonne pour remporter des lots</p>
                    <span class="btn btn--primary btn--small">JOUER</span>
                </div>
            </a>

            <!-- Machine a Sous - Enutrof -->
            <a href="slot.html" class="jeux-hub__card">
                <div class="jeux-hub__card-image">
                    <img src="assets/images/capture_ecran_enutrosors.jpg" alt="Machine a Sous">
                </div>
                <div class="jeux-hub__card-body">
                    <h2 class="jeux-hub__card-title">Machine a Sous</h2>
                    <p class="jeux-hub__card-god">Dieu Enutrof</p>
                    <p class="jeux-hub__card-desc">Faites tourner les rouleaux et decrochez le jackpot</p>
                    <span class="btn btn--primary btn--small">JOUER</span>
                </div>
            </a>
        </div>
    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js?v=20260918"></script>
</body>
</html>
