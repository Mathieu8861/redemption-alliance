<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redemption - Connexion</title>
    <link rel="icon" type="image/png" href="assets/images/logo-damocles.png?v=20260918">
    <meta name="description" content="Site de l'alliance Redemption [RDM] : combats PvP, percepteurs, recyclages, forgemagie. L'heure de la rédemption.">
    <meta name="theme-color" content="#e07c0a">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Redemption">
    <meta property="og:title" content="Redemption [RDM] - Alliance PvP Dofus">
    <meta property="og:description" content="L'heure de la rédemption. Combats, percepteurs, recyclages, forgemagie : le QG de l'alliance Redemption.">
    <meta property="og:url" content="https://redemption-alliance.vercel.app/">
    <meta property="og:image" content="https://redemption-alliance.vercel.app/assets/images/og-damocles.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://redemption-alliance.vercel.app/assets/images/og-damocles.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=20260918">
</head>
<body>
    <div class="auth-page">
        <video class="auth-page__bg" src="assets/images/fond-connexion.mp4" poster="assets/images/fond-connexion-poster.jpg" autoplay muted loop playsinline aria-hidden="true"></video>
        <img class="auth-page__logo" src="assets/images/logo-damocles-512.png?v=20260918" alt="Redemption [RDM]">
        <div class="auth-card">

            <!-- CONNEXION DISCORD -->
            <button type="button" id="btn-discord-login" class="btn btn--discord">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.317 4.369a19.79 19.79 0 0 0-4.885-1.515a.074.074 0 0 0-.079.037c-.21.375-.444.865-.608 1.25a18.27 18.27 0 0 0-5.487 0a12.6 12.6 0 0 0-.617-1.25a.077.077 0 0 0-.079-.037A19.74 19.74 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057a19.9 19.9 0 0 0 5.993 3.03a.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106a13.1 13.1 0 0 1-1.872-.892a.077.077 0 0 1-.008-.128a10.2 10.2 0 0 0 .372-.292a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127a12.3 12.3 0 0 1-1.873.892a.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028a19.84 19.84 0 0 0 6.002-3.03a.077.077 0 0 0 .032-.056c.5-5.177-.838-9.674-3.549-13.66a.06.06 0 0 0-.031-.028M8.02 15.331c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.956-2.419 2.157-2.419c1.21 0 2.176 1.096 2.157 2.42c0 1.333-.956 2.418-2.157 2.418m7.975 0c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.955-2.419 2.157-2.419c1.21 0 2.176 1.096 2.157 2.42c0 1.333-.946 2.418-2.157 2.418"/></svg>
                Se connecter avec Discord
            </button>
            <div class="auth-sep"><span>ou avec ton pseudo</span></div>

            <!-- LOGIN FORM -->
            <form id="login-form">
                <div id="login-message" class="auth-message"></div>
                <div class="form-group">
                    <label class="form-label" for="login-username">Pseudo</label>
                    <input type="text" id="login-username" class="form-input" placeholder="Votre pseudo Dofus" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="login-password">Mot de passe</label>
                    <input type="password" id="login-password" class="form-input" placeholder="Mot de passe" required>
                </div>
                <button type="submit" class="btn btn--primary">Connexion</button>
            </form>

            <!-- REGISTER FORM -->
            <form id="register-form" class="hidden">
                <div id="register-message" class="auth-message"></div>

                <!-- Avatar upload -->
                <div class="form-group" style="text-align:center;">
                    <div class="avatar-upload" id="avatar-upload">
                        <div class="avatar-upload__preview" id="avatar-preview">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        </div>
                        <span class="avatar-upload__hint">Photo de profil</span>
                        <input type="file" id="register-avatar" accept="image/*" hidden>
                    </div>
                </div>

                <!-- Pseudo + Mot de passe sur la meme ligne -->
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="register-username">Pseudo (en jeu)</label>
                        <input type="text" id="register-username" class="form-input" placeholder="Votre pseudo Dofus" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="register-password">Mot de passe</label>
                        <input type="password" id="register-password" class="form-input" placeholder="Min. 6 caracteres" required minlength="6">
                    </div>
                </div>

                <!-- Classe + Element sur la meme ligne -->
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="register-classe">Classe</label>
                        <select id="register-classe" class="form-select">
                            <option value="">Choisir...</option>
                            <option value="Cra">Cra</option>
                            <option value="Ecaflip">Ecaflip</option>
                            <option value="Eliotrope">Eliotrope</option>
                            <option value="Eniripsa">Eniripsa</option>
                            <option value="Enutrof">Enutrof</option>
                            <option value="Feca">Feca</option>
                            <option value="Forge">Forge</option>
                            <option value="Huppermage">Huppermage</option>
                            <option value="Iop">Iop</option>
                            <option value="Osamodas">Osamodas</option>
                            <option value="Ouginak">Ouginak</option>
                            <option value="Pandawa">Pandawa</option>
                            <option value="Roublard">Roublard</option>
                            <option value="Sacrieur">Sacrieur</option>
                            <option value="Sadida">Sadida</option>
                            <option value="Sram">Sram</option>
                            <option value="Steamer">Steamer</option>
                            <option value="Xelor">Xelor</option>
                            <option value="Zobal">Zobal</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="register-element">Element</label>
                        <select id="register-element" class="form-select">
                            <option value="">Choisir...</option>
                            <option value="Terre">Terre</option>
                            <option value="Feu">Feu</option>
                            <option value="Eau">Eau</option>
                            <option value="Air">Air</option>
                            <option value="Multi">Multi</option>
                            <option value="Do Pou">Do Pou</option>
                            <option value="Do Cri">Do Cri</option>
                        </select>
                    </div>
                </div>

                <!-- Dofusbook pleine largeur -->
                <div class="form-group">
                    <label class="form-label" for="register-dofusbook">Lien Dofusbook (optionnel)</label>
                    <input type="url" id="register-dofusbook" class="form-input" placeholder="https://www.dofusbook.net/...">
                </div>
                <button type="submit" class="btn btn--primary">S'inscrire</button>
            </form>

            <!-- TOGGLE -->
            <div class="auth-toggle">
                <span id="toggle-to-register">Pas encore de compte ? <a href="#">S'inscrire</a></span>
                <span id="toggle-to-login" class="hidden">Deja un compte ? <a href="#">Se connecter</a></span>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js?v=20260918"></script>
    <script src="js/auth.js?v=20260918"></script>
</body>
</html>
