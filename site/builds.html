<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redemption - Builds</title>
    <link rel="icon" type="image/png" href="assets/images/logo-damocles.png?v=20260916">
    <meta name="description" content="Site de l'alliance Redemption [RDM] : combats PvP, percepteurs, recyclages, forgemagie. L'heure de la rédemption.">
    <meta name="theme-color" content="#e07c0a">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Redemption">
    <meta property="og:title" content="Redemption [RDM] - Alliance PvP Dofus">
    <meta property="og:description" content="L'heure de la rédemption. Combats, percepteurs, recyclages, forgemagie : le QG de l'alliance Redemption.">
    <meta property="og:url" content="https://redemption-alliance.vercel.app/">
    <meta property="og:image" content="https://redemption-alliance.vercel.app/assets/images/og-damocles.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://redemption-alliance.vercel.app/assets/images/og-damocles.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=20260916">
</head>
<body>

    <header class="header">
        <div class="header__inner">
            <div class="header__brand">
                <img class="header__logo" src="assets/images/logo-damocles.png?v=20260916" alt="Logo Redemption">
                
            </div>

            <div class="header__user">
                <a href="admin.html" class="header__icon" id="nav-admin-link" title="Admin" style="display:none;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15v2m-6 4h12a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2zm10-10V7a4 4 0 0 0-8 0v4h8z"/></svg>
                </a>
                <span class="header__username" id="nav-username"></span>
                <button class="header__icon" id="btn-logout" title="Deconnexion">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                </button>
                <button class="nav__toggle" id="nav-toggle">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </div>
    </header>

    <aside id="app-sidebar" class="app-sidebar" aria-label="Navigation principale"></aside>

    <main class="main">
        <div class="mb-lg" style="display:flex; align-items:flex-start; justify-content:space-between; gap:var(--spacing-md); flex-wrap:wrap;">
            <div>
                <h1 style="font-family: var(--font-title); font-size: 1.5rem; font-weight: 700; margin-bottom: var(--spacing-xs);">Builds</h1>
                <p class="text-muted" style="font-size: 0.8125rem;">Builds proposés par les membres de l'alliance</p>
            </div>
            <button class="btn btn--primary" id="btn-build-proposer">+ Proposer un build</button>
        </div>

        <div class="build-submit" id="build-submit-panel" hidden>
            <div class="build-submit__title">Proposer un build</div>
            <div class="build-submit__row">
                <input class="form-input" id="bs-titre" type="text" placeholder="Titre du build *" maxlength="80" style="flex:2; min-width:200px;">
                <select class="form-input" id="bs-type" style="flex:1; min-width:110px;">
                    <option value="">Type</option>
                    <option value="pvp">PVP</option>
                    <option value="pvm">PVM</option>
                </select>
                <select class="form-input" id="bs-classe" style="flex:1; min-width:130px;">
                    <option value="">Classe</option>
                    <option value="Cra">Cra</option>
                    <option value="Ecaflip">Ecaflip</option>
                    <option value="Eliotrope">Eliotrope</option>
                    <option value="Eniripsa">Eniripsa</option>
                    <option value="Enutrof">Enutrof</option>
                    <option value="Feca">Feca</option>
                    <option value="Forge">Forge</option>
                    <option value="Huppermage">Huppermage</option>
                    <option value="Iop">Iop</option>
                    <option value="Osamodas">Osamodas</option>
                    <option value="Ouginak">Ouginak</option>
                    <option value="Pandawa">Pandawa</option>
                    <option value="Roublard">Roublard</option>
                    <option value="Sacrieur">Sacrieur</option>
                    <option value="Sadida">Sadida</option>
                    <option value="Sram">Sram</option>
                    <option value="Steamer">Steamer</option>
                    <option value="Xelor">Xelor</option>
                    <option value="Zobal">Zobal</option>
                </select>
                <input class="form-input" id="bs-kamas" type="number" min="0" placeholder="Prix (M kamas)" style="flex:1; min-width:120px;">
            </div>
            <input class="form-input" id="bs-lien" type="url" placeholder="Lien Dofusbook (optionnel)">
            <textarea class="form-input" id="bs-desc" rows="2" placeholder="Description (optionnel)" maxlength="300"></textarea>
            <div class="recyc-preuve__drop" id="bs-drop">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                <span>Screenshot du stuff : colle (<kbd>Ctrl</kbd>+<kbd>V</kbd>) ou clique (optionnel)</span>
                <input type="file" id="bs-file" accept="image/*" style="display:none;">
            </div>
            <div class="recyc-preuve__preview" id="bs-preview-wrap" style="display:none;">
                <img id="bs-preview" src="" alt="Aperçu du build">
                <button type="button" class="recyc-preuve__remove" id="bs-remove" title="Retirer l'image">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="build-submit__actions">
                <button class="btn btn--primary" id="bs-publier">Publier</button>
                <button class="btn btn--secondary" id="bs-annuler">Annuler</button>
            </div>
        </div>

        <div class="builds-toolbar" id="builds-filters">
            <div class="builds-toolbar__left">
                <div class="tabs" id="builds-type-tabs">
                    <button class="tabs__btn active" data-tab="tous">Tous</button>
                    <button class="tabs__btn" data-tab="pvp">PVP</button>
                    <button class="tabs__btn" data-tab="pvm">PVM</button>
                </div>
                <select class="form-select builds-filter-select" id="builds-filter-classe">
                    <option value="">Toutes les classes</option>
                    <option value="Cra">Cra</option>
                    <option value="Ecaflip">Ecaflip</option>
                    <option value="Eliotrope">Eliotrope</option>
                    <option value="Eniripsa">Eniripsa</option>
                    <option value="Enutrof">Enutrof</option>
                    <option value="Feca">Feca</option>
                    <option value="Forge">Forge</option>
                    <option value="Huppermage">Huppermage</option>
                    <option value="Iop">Iop</option>
                    <option value="Osamodas">Osamodas</option>
                    <option value="Ouginak">Ouginak</option>
                    <option value="Pandawa">Pandawa</option>
                    <option value="Roublard">Roublard</option>
                    <option value="Sacrieur">Sacrieur</option>
                    <option value="Sadida">Sadida</option>
                    <option value="Sram">Sram</option>
                    <option value="Steamer">Steamer</option>
                    <option value="Xelor">Xelor</option>
                    <option value="Zobal">Zobal</option>
                </select>
                <select class="form-select builds-filter-select" id="builds-filter-sort">
                    <option value="recent">Plus récents</option>
                    <option value="prix-asc">Prix croissant</option>
                    <option value="prix-desc">Prix décroissant</option>
                </select>
                <input type="text" class="form-input builds-search" id="builds-search" placeholder="Rechercher...">
            </div>
        </div>

        <div class="builds-grid" id="builds-grid">
            <div class="loading"><div class="spinner"></div> Chargement...</div>
        </div>
    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js?v=20260916"></script>
    <script src="js/builds.js?v=20260916"></script>
</body>
</html>
